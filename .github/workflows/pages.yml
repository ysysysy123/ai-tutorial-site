name: Build and deploy tutorial site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site configuration
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch upstream tutorials
        uses: actions/checkout@v6
        with:
          repository: Akun-python/autumn-recruitment
          ref: main
          path: _source
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate chapter navigation
        run: python scripts/prepare_docs.py
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m mkdocs build -f mkdocs.generated.yml
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
