site_name: 秋招算法与 AI 学习教程
site_description: Autumn-Recruit Algo Notes 的个人阅读站
site_url: !ENV [SITE_URL, ""]
repo_url: https://github.com/Akun-python/autumn-recruitment
repo_name: Akun-python/autumn-recruitment
docs_dir: _source
site_dir: site
use_directory_urls: false
copyright: Copyright &copy; 2025 autumn-recruit-algo contributors · MIT

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: [zh, en]
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      cache: false
      include_source: true
      no_prompt: true

hooks:
  - scripts/notebook_links.py

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/reading.css
extra_javascript:
  - assets/javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - path: assets/javascripts/diagrams.mjs
    type: module
